name: Build site

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/parse_readme.py

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse README to JSON
        run: python3 scripts/parse_readme.py README.md docs/data.json

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || (git commit -m "Update data.json [skip ci]" && git push)
